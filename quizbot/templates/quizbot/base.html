<!DOCTYPE html>
<html>
<head>
    <title>QuizBot</title>
    <style>
        body { font-family: sans-serif; margin: 2em; line-height: 1.6; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 2em; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { border: 1px solid #ddd; padding: 1.5em; margin-bottom: 1em; border-radius: 8px; background: #fff; }
        .btn { padding: 0.6em 1.2em; text-decoration: none; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; display: inline-block; }
        .btn:hover { background: #218838; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1em; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 0.5em; }
        .option { display: block; margin: 0.5em 0; padding: 0.8em; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #e9ecef; }
        input[type="radio"] { margin-right: 10px; }
        .progress { margin-bottom: 1em; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2><a href="{% url 'quizbot:home' %}" style="text-decoration: none; color: inherit;">QuizBot</a></h2>
            <div>
                {% if user.is_authenticated %}
                    <span>{{ user.username }}</span> |
                    <form action="{% url 'logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-secondary" style="padding: 0.3em 0.6em;">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn">Login</a>
                {% endif %}
            </div>
        </div>
        <hr>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
