{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Quizbot{% endblock %}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
               max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        header { display: flex; justify-content: space-between; align-items: baseline;
                 border-bottom: 1px solid #ddd; padding-bottom: .5rem; margin-bottom: 1.5rem; }
        h1 { margin: 0; font-size: 1.4rem; }
        a { color: #2a6df4; }
        button, input[type="submit"] {
            background: #2a6df4; color: white; border: 0; padding: .5rem 1rem;
            border-radius: 4px; cursor: pointer; font-size: 1rem;
        }
        button:hover, input[type="submit"]:hover { background: #1d5cd6; }
        .topic-input { padding: .5rem; font-size: 1rem; width: 100%;
                       box-sizing: border-box; margin-bottom: .5rem; }
        ul.choices { list-style: none; padding: 0; }
        ul.choices li { margin: .5rem 0; }
        ul.choices label { display: block; padding: .75rem 1rem; border: 1px solid #ddd;
                           border-radius: 4px; cursor: pointer; }
        ul.choices label:hover { background: #f3f6ff; border-color: #2a6df4; }
        .difficulty { color: #888; font-size: .9rem; }
        .errorlist { color: #c00; list-style: none; padding: 0; }
        .score-big { font-size: 3rem; margin: 0; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'quizbot:home' %}" style="text-decoration:none;color:inherit;">🧠 Quizbot</a></h1>
        <div>
            {% if user.is_authenticated %}
                Signed in as <strong>{{ user.username }}</strong> —
                <form action="{% url 'logout' %}" method="post" style="display:inline">{% csrf_token %}
                    <button type="submit" style="background:none;color:#2a6df4;padding:0;">Log out</button>
                </form>
            {% endif %}
        </div>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
